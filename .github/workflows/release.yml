name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify release version
        shell: pwsh
        run: |
          & git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main; git exited with code $LASTEXITCODE."
          }

          .\tools\Test-ReleasePreconditions.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -MainRef origin/main

          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string] $props.Project.PropertyGroup.Version
          $isPrerelease = $version.Contains('-')
          "RELEASE_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test and build Velopack packages
        shell: pwsh
        run: |
          $repositoryUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          .\tools\Publish-Release.ps1 -RepositoryUrl $repositoryUrl

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDirectory = 'artifacts\velopack\releases'
          $assetNames = @(
            "UsageDeck-$env:RELEASE_VERSION-full.nupkg"
            'UsageDeck-win-Portable.zip'
            'UsageDeck-win-Setup.exe'
            'releases.win.json'
            'SHA256SUMS.txt'
          )
          $assets = @(
            foreach ($assetName in $assetNames) {
              $assetPath = Join-Path $releaseDirectory $assetName
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                throw "Required release asset '$assetName' was not produced in '$releaseDirectory'."
              }

              (Get-Item -LiteralPath $assetPath).FullName
            }
          )

          $releaseNotesPath = ".github\release-notes\$env:GITHUB_REF_NAME.md"
          $releaseTitle = "UsageDeck $($env:GITHUB_REF_NAME.TrimStart('v'))"
          $isPrerelease = $env:RELEASE_IS_PRERELEASE -eq 'true'

          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Required release notes were not found at '$releaseNotesPath'."
          }

          if ($isPrerelease) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --prerelease `
              --notes-file $releaseNotesPath --title $releaseTitle @assets
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag `
              --notes-file $releaseNotesPath --title $releaseTitle @assets
          }
